              "$wheel" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys
          import zipfile

          receipt_path = pathlib.Path(sys.argv[1])
          wheel_path = pathlib.Path(sys.argv[2])
          receipt_bytes = receipt_path.read_bytes()
          receipt = json.loads(receipt_bytes)
          assert receipt_bytes == (
              json.dumps(receipt, allow_nan=False, separators=(",", ":"), sort_keys=True)
              + "\n"
          ).encode()
          assert set(receipt) == {
              "extension_basename",
              "extension_byte_count",
              "extension_sha256",
              "package",
              "python_abi",
              "schema_version",
              "sdist_sha256",
              "version",
              "wheel_basename",
              "wheel_byte_count",
              "wheel_sha256",
