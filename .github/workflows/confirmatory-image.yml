          assert receipt["wheel_basename"] == wheel_path.name
          wheel_bytes = wheel_path.read_bytes()
          assert receipt["wheel_byte_count"] == len(wheel_bytes)
          assert receipt["wheel_sha256"] == hashlib.sha256(wheel_bytes).hexdigest()
          assert re.fullmatch(r"[0-9a-f]{64}", receipt["extension_sha256"])
          with zipfile.ZipFile(wheel_path) as archive:
              members = [
                  name
                  for name in archive.namelist()
                  if name.startswith("hnswlib") and name.endswith(".so")
              ]
              assert len(members) == 1, members
              extension_bytes = archive.read(members[0])
          assert receipt["extension_basename"] == pathlib.PurePosixPath(members[0]).name
          assert receipt["extension_byte_count"] == len(extension_bytes)
          assert receipt["extension_sha256"] == hashlib.sha256(extension_bytes).hexdigest()
          PY
            python - \
              "$runtime_dir/opa-build/opa-build-receipt.json" \
              "$runtime_dir/native-build/native-build-receipt.json" \
              "$runtime_dir/runtime-library-manifest.json" \
              "$runtime_dir/opa" \
              "$runtime_dir/libsqlite3.so.0" \
