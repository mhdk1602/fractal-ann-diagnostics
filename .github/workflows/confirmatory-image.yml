              --argjson source_date_epoch "$SOURCE_DATE_EPOCH" \
              --argjson sqlite_library_byte_count "$sqlite_library_byte_count" \
              --argjson uv_lock_byte_count "$uv_lock_byte_count" \
              --argjson zlib_library_byte_count "$zlib_library_byte_count" \
              '{c0_sha: $c0_sha,
                hnswlib_receipt_image_path: $hnswlib_receipt_image_path,
                hnswlib_receipt_sha256: $hnswlib_receipt_sha256,
                hnswlib_wheel_basename: $hnswlib_wheel_basename,
                hnswlib_wheel_byte_count: $hnswlib_wheel_byte_count,
                hnswlib_wheel_image_path: $hnswlib_wheel_image_path,
