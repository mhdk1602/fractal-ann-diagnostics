          network_name="c0-quicknet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server_name="c0-quicknet-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_interop() {
            if [[ -n "$server_name" ]]; then
              docker rm -f "$server_name" >/dev/null 2>&1 || true
            fi
            if [[ -n "$network_name" ]]; then
