              "import hashlib, urllib.request; payload = urllib.request.urlopen('http://127.0.0.1:8080/${chain_hash}/info', timeout=1).read(); assert hashlib.sha256(payload).hexdigest() == '3e690bc527c8a4e78232bc06b5a3cff057c51c68f51b208a1a21b2abd6d6b194'"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          client=(
            --rm
            --pull never
            --network "$network_name"
