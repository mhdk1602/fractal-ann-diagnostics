            --arg release_image_reference "$release_reference" \
            --arg safe_binary_sha256 "$safe_binary_sha256" \
            --arg safe_ciphertext_sha256 "$safe_ciphertext_sha256" \
            --arg official_archive_url "$official_url" \
            --arg official_ciphertext_sha256 "$official_ciphertext_sha256" '
              {chain_hash: $chain_hash,
               directions: [
                 {ciphertext_byte_count: 609,
                  ciphertext_sha256: $safe_ciphertext_sha256,
                  decrypted_plaintext_sha256:
                    "447c313c4c836c52f2fa29afdbcb2d9ab47637e6596892b4b1f0401eddfd4f4d",
                  decryptor: "official-v1.2.0",
                  encryptor: "source-built-safe-v1.2.0",
                  plaintext_equal: true},
                 {ciphertext_byte_count: 609,
                  ciphertext_sha256: $official_ciphertext_sha256,
                  decrypted_plaintext_sha256:
                    "447c313c4c836c52f2fa29afdbcb2d9ab47637e6596892b4b1f0401eddfd4f4d",
                  decryptor: "source-built-safe-v1.2.0",
                  encryptor: "official-v1.2.0",
                  plaintext_equal: true}],
               external_client_network_access: false,
               fixture_chain_info_sha256:
                 "3e690bc527c8a4e78232bc06b5a3cff057c51c68f51b208a1a21b2abd6d6b194",
               fixture_round_sha256:
                 "4275f9ee6cd9f767fb82e9877880bbb5659c961306c40051675bc76dded4d9be",
               official_archive_sha256:
                 "3b724032620587c2551ee857c98dc02690076f4972a4fe4389b0f6e0911a6a92",
               official_archive_url: $official_archive_url,
               official_binary_byte_count: 11862151,
               official_binary_sha256:
                 "e153cfa8539e871f50143d1bde10fec7ec3fe82630f717c3c1bf166eb4975059",
               plaintext_byte_count: 38,
               plaintext_sha256:
                 "447c313c4c836c52f2fa29afdbcb2d9ab47637e6596892b4b1f0401eddfd4f4d",
               quicknet_api_identity: "https://api.drand.sh/",
               quicknet_round: $round,
               release_image_reference: $release_image_reference,
               safe_binary_sha256: $safe_binary_sha256,
               schema_version: "fractal-tlock-quicknet-interoperability-v1",
               transport: "isolated-local-http-over-pinned-quicknet-fixture"}' \
            > "$output/interoperability-receipt.json"
          jq -e \
            --arg reference "$release_reference" '
              .schema_version == "fractal-tlock-quicknet-interoperability-v1"
              and .release_image_reference == $reference
              and .safe_binary_sha256
                == "ca9d498b6a3c1ea8edff9ace7bf00eb0f90ce67166343161f9a53f21900a6ef5"
              and .external_client_network_access == false
              and .quicknet_round == 30485281
              and ([.directions[] | .plaintext_equal] == [true, true])
              and ([.directions[] | .encryptor] | sort
                == ["official-v1.2.0", "source-built-safe-v1.2.0"])
              and ([.directions[] | .decryptor] | sort
                == ["official-v1.2.0", "source-built-safe-v1.2.0"])
            ' "$output/interoperability-receipt.json" >/dev/null
          sha256sum "$output/interoperability-receipt.json" \
            > "$output/interoperability-receipt.sha256"
          sha256sum "$output/checksums.txt" > "$output/checksums.txt.sha256"
          sha256sum "$output/$official_archive" \
            > "$output/$official_archive.sha256"
          sha256sum "$output/official-tle" > "$output/official-tle.sha256"
          rm -- "$output/official-tle"
          chmod -R a-w "$output"

      - name: Require public anonymous digest access
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Buildx returned a noncanonical image digest' >&2
            exit 67
          fi
          evidence_dir="${RUNNER_TEMP}/confirmatory-image-evidence"
          anonymous_config="${RUNNER_TEMP}/anonymous-docker-config"
          buildx_path="${HOME}/.docker/cli-plugins/docker-buildx"
          digest_reference="${IMAGE_NAME}@${IMAGE_DIGEST}"
          package_name="${IMAGE_NAME##*/}"
          settings_url="https://github.com/users/mhdk1602/packages/container/${package_name}/settings"
          install -d -m 0700 "$anonymous_config"
          printf '{}\n' > "$anonymous_config/config.json"
          chmod 0600 "$anonymous_config/config.json"
          jq -e 'type == "object" and keys == []' "$anonymous_config/config.json" >/dev/null
          test -x "$buildx_path"
          attempts_log="$evidence_dir/anonymous-registry-attempts.log"
          : > "$attempts_log"
          success=false
          final_status=1
          attempt=0
          for attempt in $(seq 1 60); do
            stdout_file="${RUNNER_TEMP}/anonymous-registry-stdout.json"
            stderr_file="${RUNNER_TEMP}/anonymous-registry-stderr.txt"
            set +e
            env -i \
              DOCKER_CONFIG="$anonymous_config" \
              HOME="$HOME" \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              PATH=/usr/bin:/bin \
              "$buildx_path" imagetools inspect "$digest_reference" \
                --format '{{json .Manifest}}' \
                > "$stdout_file" 2> "$stderr_file"
            final_status=$?
            set -e
            printf '%s\t%s\t%s\n' \
              "$attempt" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$final_status" \
              >> "$attempts_log"
            if [[ "$final_status" -eq 0 ]] \
                && jq -e --arg digest "$IMAGE_DIGEST" '.digest == $digest' \
                  "$stdout_file" >/dev/null; then
              success=true
              break
            fi
            if [[ "$attempt" -eq 1 ]]; then
              echo "::notice title=GHCR public-visibility gate::Change the C0 package to Public at ${settings_url}. The workflow will retry anonymous digest access for 30 minutes."
            fi
            if [[ "$attempt" -lt 60 ]]; then
              sleep 30
            fi
          done
          if [[ "$success" != true ]]; then
            echo 'The digest was not anonymously readable before the publication gate expired' >&2
            tail -n 20 "$stderr_file" >&2 || true
            exit 69
          fi
          jq -e 'type == "object" and keys == []' "$anonymous_config/config.json" >/dev/null
          cp -- "$anonymous_config/config.json" \
            "$evidence_dir/anonymous-docker-config.json"
          jq -S -c . "$stdout_file" > "$evidence_dir/anonymous-registry-index.json"
          env -i \
            DOCKER_CONFIG="$anonymous_config" \
            HOME="$HOME" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/bin:/bin \
            "$buildx_path" imagetools inspect "$digest_reference" --raw \
            > "$evidence_dir/anonymous-registry-index.raw.json"
          printf '%s  %s\n' "${IMAGE_DIGEST#sha256:}" \
            "$evidence_dir/anonymous-registry-index.raw.json" | sha256sum -c -
          cp -- "$stderr_file" "$evidence_dir/anonymous-registry-stderr.txt"
          cmp --silent \
            "$evidence_dir/registry-index.json" \
            "$evidence_dir/anonymous-registry-index.json"
          config_sha256="$(sha256sum "$anonymous_config/config.json" | cut -d ' ' -f 1)"
          stdout_sha256="$(sha256sum "$evidence_dir/anonymous-registry-index.json" \
            | cut -d ' ' -f 1)"
          stderr_sha256="$(sha256sum "$evidence_dir/anonymous-registry-stderr.txt" \
            | cut -d ' ' -f 1)"
          attempts_sha256="$(sha256sum "$attempts_log" | cut -d ' ' -f 1)"
          observed_digest="$(jq -r .digest "$evidence_dir/anonymous-registry-index.json")"
          verified_at_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -S -c -n \
            --arg attempts_log_sha256 "$attempts_sha256" \
            --arg buildx_path "$buildx_path" \
            --arg docker_config_path "$anonymous_config" \
            --arg docker_config_sha256 "$config_sha256" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_reference "$digest_reference" \
            --arg observed_digest "$observed_digest" \
            --arg stderr_sha256 "$stderr_sha256" \
            --arg stdout_sha256 "$stdout_sha256" \
            --arg verified_at_utc "$verified_at_utc" \
            --argjson attempt_count "$attempt" \
            --argjson exit_status "$final_status" \
            '{attempt_count: $attempt_count,
              attempts_log_sha256: $attempts_log_sha256,
              buildx_path: $buildx_path,
              docker_config_path: $docker_config_path,
              docker_config_sha256: $docker_config_sha256,
              docker_config_was_empty_object: true,
              environment_allowlist: ["DOCKER_CONFIG", "HOME", "LANG", "LC_ALL", "PATH"],
              exit_status: $exit_status,
              image_digest: $image_digest,
              image_reference: $image_reference,
              observed_digest: $observed_digest,
              public_anonymous_access: true,
              schema_version: "fractal-c0-anonymous-registry-verification-v1",
              stderr_sha256: $stderr_sha256,
              stdout_sha256: $stdout_sha256,
              verified_at_utc: $verified_at_utc}' \
            > "$evidence_dir/anonymous-registry-verification.json"
          test "$observed_digest" = "$IMAGE_DIGEST"
          release_digest_reference="${RELEASE_IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}"
          release_package_name="${RELEASE_IMAGE_NAME##*/}"
          release_settings_url="https://github.com/users/mhdk1602/packages/container/${release_package_name}/settings"
          release_attempts_log="$evidence_dir/anonymous-release-registry-attempts.log"
          : > "$release_attempts_log"
          release_success=false
          release_final_status=1
          release_attempt=0
          for release_attempt in $(seq 1 60); do
            release_stdout="${RUNNER_TEMP}/anonymous-release-registry-stdout.json"
            release_stderr="${RUNNER_TEMP}/anonymous-release-registry-stderr.txt"
            set +e
            env -i \
              DOCKER_CONFIG="$anonymous_config" \
              HOME="$HOME" \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              PATH=/usr/bin:/bin \
              "$buildx_path" imagetools inspect "$release_digest_reference" \
                --format '{{json .Manifest}}' \
                > "$release_stdout" 2> "$release_stderr"
            release_final_status=$?
            set -e
            printf '%s\t%s\t%s\n' \
              "$release_attempt" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$release_final_status" >> "$release_attempts_log"
            if [[ "$release_final_status" -eq 0 ]] \
                && jq -e --arg digest "$RELEASE_IMAGE_DIGEST" '.digest == $digest' \
                  "$release_stdout" >/dev/null; then
              release_success=true
              break
            fi
            if [[ "$release_attempt" -eq 1 ]]; then
              echo "::notice title=GHCR release-image visibility gate::Change the C0 release package to Public at ${release_settings_url}. The workflow will retry anonymous digest access for 30 minutes."
            fi
            if [[ "$release_attempt" -lt 60 ]]; then
              sleep 30
            fi
          done
          if [[ "$release_success" != true ]]; then
            echo 'The release-image digest was not anonymously readable before the publication gate expired' >&2
            tail -n 20 "$release_stderr" >&2 || true
            exit 69
          fi
          jq -S -c . "$release_stdout" \
            > "$evidence_dir/anonymous-release-registry-index.json"
          env -i \
            DOCKER_CONFIG="$anonymous_config" \
            HOME="$HOME" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/bin:/bin \
            "$buildx_path" imagetools inspect "$release_digest_reference" --raw \
            > "$evidence_dir/anonymous-release-registry-index.raw.json"
          printf '%s  %s\n' "${RELEASE_IMAGE_DIGEST#sha256:}" \
            "$evidence_dir/anonymous-release-registry-index.raw.json" | sha256sum -c -
          cp -- "$release_stderr" \
            "$evidence_dir/anonymous-release-registry-stderr.txt"
          cmp --silent \
            "$evidence_dir/registry-release-index.json" \
            "$evidence_dir/anonymous-release-registry-index.json"
          release_stdout_sha256="$(sha256sum \
            "$evidence_dir/anonymous-release-registry-index.json" | cut -d ' ' -f 1)"
          release_stderr_sha256="$(sha256sum \
            "$evidence_dir/anonymous-release-registry-stderr.txt" | cut -d ' ' -f 1)"
          release_attempts_sha256="$(sha256sum "$release_attempts_log" \
            | cut -d ' ' -f 1)"
          release_observed_digest="$(jq -r .digest \
            "$evidence_dir/anonymous-release-registry-index.json")"
          jq -S -c -n \
            --arg attempts_log_sha256 "$release_attempts_sha256" \
            --arg image_digest "$RELEASE_IMAGE_DIGEST" \
            --arg image_reference "$release_digest_reference" \
            --arg observed_digest "$release_observed_digest" \
            --arg stderr_sha256 "$release_stderr_sha256" \
            --arg stdout_sha256 "$release_stdout_sha256" \
            --argjson attempt_count "$release_attempt" \
            --argjson exit_status "$release_final_status" \
            '{attempt_count: $attempt_count,
              attempts_log_sha256: $attempts_log_sha256,
              docker_config_was_empty_object: true,
              exit_status: $exit_status,
              image_digest: $image_digest,
              image_reference: $image_reference,
              observed_digest: $observed_digest,
              public_anonymous_access: true,
              schema_version: "fractal-c0-anonymous-release-registry-verification-v1",
              stderr_sha256: $stderr_sha256,
              stdout_sha256: $stdout_sha256}' \
            > "$evidence_dir/anonymous-release-registry-verification.json"
          test "$release_observed_digest" = "$RELEASE_IMAGE_DIGEST"

      - name: Retain and adjudicate raw Trivy and CycloneDX evidence
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/confirmatory-image-evidence"
          sealed_context="${RUNNER_TEMP}/confirmatory-c0-context"
          registry_index="$evidence_dir/registry-index.json"
          trivy_cache="${RUNNER_TEMP}/trivy-cache"
          install -d -m 0700 "$trivy_cache"
          test -f "$registry_index"
          docker pull --platform linux/amd64 "$TRIVY_IMAGE" >/dev/null
          docker image inspect "$TRIVY_IMAGE" --format '{{json .}}' \
            | jq -S -c . > "$evidence_dir/trivy-image.json"
          jq -e \
            --arg digest \
              sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f '
              .[0].RepoDigests
              | any(.[]; endswith("@" + $digest))
            ' "$evidence_dir/trivy-image.json" >/dev/null
          docker run --rm \
            --platform linux/amd64 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=${trivy_cache},dst=/root/.cache/trivy" \
            "$TRIVY_IMAGE" \
            image --download-db-only --no-progress --disable-telemetry
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=${trivy_cache},dst=/root/.cache/trivy,readonly" \
            "$TRIVY_IMAGE" \
            version --format json \
            | jq -S -c . > "$evidence_dir/trivy-version-db.json"
          jq -e '
            .Version == "0.72.0"
            and .VulnerabilityDB.Version == 2
            and (.VulnerabilityDB.UpdatedAt | type == "string" and length > 0)
            and (.VulnerabilityDB.DownloadedAt | type == "string" and length > 0)
          ' "$evidence_dir/trivy-version-db.json" >/dev/null
          run_trivy() {
            docker run --rm \
              --platform linux/amd64 \
              --network none \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
              --mount "type=bind,src=${trivy_cache},dst=/root/.cache/trivy,readonly" \
              --mount "type=bind,src=${evidence_dir},dst=/evidence,readonly" \
              "$TRIVY_IMAGE" "$@"
          }
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            slug="${os}-${architecture}"
            manifest_digest="$(jq -r \
              --arg os "$os" \
              --arg architecture "$architecture" '
                .manifests[]
                  | select(.platform.os == $os and .platform.architecture == $architecture)
                  | .digest
              ' "$registry_index")"
            if [[ ! "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "missing platform manifest for ${platform}" >&2
              exit 70
            fi
            platform_reference="${IMAGE_NAME}@${manifest_digest}"
            docker pull --platform "$platform" "$platform_reference" >/dev/null
            direct="$evidence_dir/${slug}-trivy-direct.json"
            cyclonedx="$evidence_dir/${slug}-trivy.cdx.json"
            sbom_scan="$evidence_dir/${slug}-trivy-sbom-rescan.json"
            adjudication="$evidence_dir/${slug}-security-adjudication.json"
            run_trivy image \
              --image-src docker \
              --scanners vuln \
              --format json \
              --skip-db-update \
              --skip-java-db-update \
              --skip-vex-repo-update \
              --skip-version-check \
              --disable-telemetry \
              --no-progress \
              "$platform_reference" > "$direct"
            run_trivy image \
              --image-src docker \
              --scanners vuln \
              --format cyclonedx \
              --skip-db-update \
              --skip-java-db-update \
              --skip-vex-repo-update \
              --skip-version-check \
              --disable-telemetry \
              --no-progress \
              "$platform_reference" > "$cyclonedx"
            run_trivy sbom \
              --scanners vuln \
              --format json \
              --skip-db-update \
              --skip-java-db-update \
              --skip-vex-repo-update \
              --skip-version-check \
              --disable-telemetry \
              --no-progress \
              "/evidence/${slug}-trivy.cdx.json" > "$sbom_scan"
            /usr/bin/python3 \
              "$sealed_context/src/fractal_ann_diagnostics/runner_image_security.py" \
              --platform "$platform" \
              --image-role scientific \
              --direct-trivy "$direct" \
              --sbom-trivy "$sbom_scan" \
              --cyclonedx "$cyclonedx" \
              --output "$adjudication" \
              > "$evidence_dir/${slug}-security-adjudication.stdout"
            jq -e \
              --arg platform "$platform" '
                .schema_version == "fractal-runner-security-adjudication-v1"
                and .platform == $platform
                and .image_role == "scientific"
                and .policy == "zero-raw-high-critical-and-direct-sbom-parity"
                and .direct_sbom_parity == true
                and .raw_high_critical_count == 0
                and .severity_counts.HIGH == 0
                and .severity_counts.CRITICAL == 0
                and .vex_required == false
                and .vex_documents == []
              ' "$adjudication" >/dev/null
          done
          release_manifest_digest="$(jq -r '
            .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "arm64")
              | .digest
            ' "$evidence_dir/registry-release-index.json")"
          if [[ ! "$release_manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'missing release linux/arm64 manifest' >&2
            exit 70
          fi
          release_reference="${RELEASE_IMAGE_NAME}@${release_manifest_digest}"
          docker pull --platform linux/arm64 "$release_reference" >/dev/null
          release_direct="$evidence_dir/release-linux-arm64-trivy-direct.json"
          release_cyclonedx="$evidence_dir/release-linux-arm64-trivy.cdx.json"
          release_sbom_scan="$evidence_dir/release-linux-arm64-trivy-sbom-rescan.json"
          release_adjudication="$evidence_dir/release-linux-arm64-security-adjudication.json"
          run_trivy image \
            --image-src docker \
            --scanners vuln \
            --format json \
            --skip-db-update \
            --skip-java-db-update \
            --skip-vex-repo-update \
            --skip-version-check \
            --disable-telemetry \
            --no-progress \
            "$release_reference" > "$release_direct"
          run_trivy image \
            --image-src docker \
            --scanners vuln \
            --format cyclonedx \
            --skip-db-update \
            --skip-java-db-update \
            --skip-vex-repo-update \
            --skip-version-check \
            --disable-telemetry \
            --no-progress \
            "$release_reference" > "$release_cyclonedx"
          run_trivy sbom \
            --scanners vuln \
            --format json \
            --skip-db-update \
            --skip-java-db-update \
            --skip-vex-repo-update \
            --skip-version-check \
            --disable-telemetry \
            --no-progress \
            /evidence/release-linux-arm64-trivy.cdx.json > "$release_sbom_scan"
          /usr/bin/python3 \
            "$sealed_context/src/fractal_ann_diagnostics/runner_image_security.py" \
            --platform linux/arm64 \
            --image-role timelock-release \
            --direct-trivy "$release_direct" \
            --sbom-trivy "$release_sbom_scan" \
            --cyclonedx "$release_cyclonedx" \
            --output "$release_adjudication" \
            > "$evidence_dir/release-linux-arm64-security-adjudication.stdout"
          jq -e '
            .schema_version == "fractal-runner-security-adjudication-v1"
            and .platform == "linux/arm64"
            and .image_role == "timelock-release"
            and .direct_sbom_parity == true
            and .raw_high_critical_count == 0
            and .severity_counts.HIGH == 0
            and .severity_counts.CRITICAL == 0
            and .severity_counts.UNKNOWN == 1
            and .finding_count == 1
            and .findings == [{
              fixed_version: "",
              installed_version: "v0.54.0",
              package_id: "golang.org/x/crypto@v0.54.0",
              package_name: "golang.org/x/crypto",
              result_class: "lang-pkgs",
              result_type: "gobinary",
              severity: "UNKNOWN",
              status: "affected",
              vulnerability_id: "GO-2026-5932"
            }]
            and .vex_required == false
            and .vex_documents == []
          ' "$release_adjudication" >/dev/null

      - name: Retain govulncheck source and symbol reachability evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/confirmatory-image-evidence"
          sealed_context="${RUNNER_TEMP}/confirmatory-c0-context"
          work="${RUNNER_TEMP}/tlock-govulncheck-work"
          output="$evidence_dir/tlock-govulncheck"
          install -d -m 0700 "$work" "$output"
          source_archive="$work/tlock-source.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --silent \
            --show-error \
            --tlsv1.2 \
            --output "$source_archive" \
            https://github.com/drand/tlock/archive/7b54141a9733fd6fa207587a11148280e6fb020d.tar.gz
          printf '%s  %s\n' \
            98b5edb760cffbe6edd392f004d2d51fcc7a8e6ef7ed7672c32b1a9e1ce3e32d \
            "$source_archive" | sha256sum -c -
          /usr/bin/python3 - "$source_archive" "$work/source" <<'PY'
          import pathlib
          import stat
          import sys
          import tarfile

          archive_path = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          destination.mkdir(mode=0o700)
          prefix = "tlock-7b54141a9733fd6fa207587a11148280e6fb020d/"
          with tarfile.open(archive_path, mode="r:gz") as archive:
              members = archive.getmembers()
              if not members or len(members) > 10000:
                  raise SystemExit("tlock source archive has an invalid member count")
              seen = set()
              for member in members:
                  if member.name == prefix.removesuffix("/") and member.isdir():
                      continue
                  if not member.name.startswith(prefix):
                      raise SystemExit("tlock source archive has another root")
                  relative = pathlib.PurePosixPath(member.name.removeprefix(prefix))
                  if (
                      not relative.parts
                      or relative.is_absolute()
                      or ".." in relative.parts
                      or str(relative) in seen
                      or not (member.isdir() or member.isreg())
                  ):
                      raise SystemExit("tlock source archive contains an unsafe member")
                  seen.add(str(relative))
                  target = destination.joinpath(*relative.parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      target.chmod(0o755)
                      continue
