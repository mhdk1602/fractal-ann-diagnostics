              "$architecture" \
              "$SOURCE_DATE_EPOCH" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          def canonical_receipt(path_text):
              path = pathlib.Path(path_text)
              payload = path.read_bytes()
              value = json.loads(payload)
              assert payload == (
                  json.dumps(value, allow_nan=False, separators=(",", ":"), sort_keys=True)
                  + "\n"
              ).encode()
              return value

          opa_receipt = canonical_receipt(sys.argv[1])
          native_receipt = canonical_receipt(sys.argv[2])
          library_manifest = canonical_receipt(sys.argv[3])
          opa_path = pathlib.Path(sys.argv[4])
          sqlite_path = pathlib.Path(sys.argv[5])
          zlib_path = pathlib.Path(sys.argv[6])
          architecture = sys.argv[7]
          source_epoch = int(sys.argv[8])

          assert opa_receipt["schema_version"] == "fractal-opa-build-receipt-v1"
          assert opa_receipt["target_arch"] == architecture
          assert opa_receipt["source_date_epoch"] == source_epoch
          assert opa_receipt["go_version"] == "1.26.5"
          assert opa_receipt["opa_version"] == "1.18.2"
          assert opa_receipt["oras_patched_version"] == "2.6.2"
          assert opa_receipt["x_sync_patched_version"] == "0.22.0"
          assert opa_receipt["opa_sha256"] == hashlib.sha256(opa_path.read_bytes()).hexdigest()
          assert native_receipt["schema_version"] == "fractal-native-build-receipt-v1"
          assert native_receipt["source_date_epoch"] == source_epoch
          assert native_receipt["sqlite_library_sha256"] == hashlib.sha256(
              sqlite_path.read_bytes()
          ).hexdigest()
          assert native_receipt["zlib_library_sha256"] == hashlib.sha256(
              zlib_path.read_bytes()
          ).hexdigest()
          assert library_manifest["schema_version"] == (
              "fractal-runtime-library-manifest-v1"
          )
          records = {
              record["destination_path"]: record
              for record in library_manifest["libraries"]
          }
          assert records["/opt/native-libs/libsqlite3.so.0"]["sha256"] == (
              hashlib.sha256(sqlite_path.read_bytes()).hexdigest()
          )
          assert records["/opt/native-libs/libz.so.1"]["sha256"] == (
              hashlib.sha256(zlib_path.read_bytes()).hexdigest()
          )
          PY
            opa_sha256="$(sha256sum "$runtime_dir/opa" | cut -d ' ' -f 1)"
            opa_byte_count="$(stat -c '%s' "$runtime_dir/opa")"
            python_binary_sha256="$(sha256sum "$runtime_dir/python" | cut -d ' ' -f 1)"
            python_binary_byte_count="$(stat -c '%s' "$runtime_dir/python")"
            uv_lock_sha256="$(sha256sum "$runtime_dir/uv.lock" | cut -d ' ' -f 1)"
            uv_lock_byte_count="$(stat -c '%s' "$runtime_dir/uv.lock")"
            receipt_sha256="$(sha256sum "$runtime_dir/hnswlib-runtime-receipt.json" \
