      - name: Retain the verified candidate readback in production
        if: inputs.mode == 'production'
        shell: bash
        env:
          BUILD_CONTEXT_TREE_SHA256: ${{ steps.source.outputs.context_tree_sha256 }}
          C0_SHA: ${{ inputs.c0_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
        run: |
          set -euo pipefail
          record_dir="${RUNNER_TEMP}/confirmatory-image-digest"
          candidate_dir="${RUNNER_TEMP}/candidate-rehearsal-readback"
          promotion_dir="${RUNNER_TEMP}/candidate-oci-promotion"
          anonymous_dir="${RUNNER_TEMP}/confirmatory-image-evidence"
          test -d "$record_dir"
          test -d "$promotion_dir"
          test -f "$candidate_dir/candidate-run-api.json"
          test -f "$candidate_dir/candidate-artifacts-api.json"
          test -f "$candidate_dir/candidate-closure.zip"
          test -f "$candidate_dir/candidate-closure.json"
          test -f "$candidate_dir/candidate-closure.sha256"
          cmp --silent \
            "$promotion_dir/candidate-scientific-index.raw.json" \
            "$promotion_dir/promoted-scientific-index.raw.json"
          cmp --silent \
            "$promotion_dir/promoted-scientific-index.raw.json" \
            "$anonymous_dir/anonymous-registry-index.raw.json"
          cmp --silent \
            "$promotion_dir/candidate-release-index.raw.json" \
            "$promotion_dir/promoted-release-index.raw.json"
          cmp --silent \
            "$promotion_dir/promoted-release-index.raw.json" \
            "$anonymous_dir/anonymous-release-registry-index.raw.json"
          test "$(jq -r .build_context_tree_sha256 \
            "$candidate_dir/candidate-closure.json")" = "$BUILD_CONTEXT_TREE_SHA256"
          test "$(jq -r .scientific_image_index_digest \
            "$candidate_dir/candidate-closure.json")" = "$IMAGE_DIGEST"
          test "$(jq -r .release_image_index_digest \
            "$candidate_dir/candidate-closure.json")" = "$RELEASE_IMAGE_DIGEST"
          candidate_scientific_amd64="$(jq -r \
            .scientific_linux_amd64_manifest_digest \
            "$candidate_dir/candidate-closure.json")"
          candidate_scientific_arm64="$(jq -r \
            .scientific_linux_arm64_manifest_digest \
            "$candidate_dir/candidate-closure.json")"
          candidate_release_arm64="$(jq -r \
            .release_linux_arm64_manifest_digest \
            "$candidate_dir/candidate-closure.json")"
          production_scientific_amd64="$(jq -r '
            .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "amd64")
              | .digest
            ' "$record_dir/registry-index.json")"
          production_scientific_arm64="$(jq -r '
            .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "arm64")
              | .digest
            ' "$record_dir/registry-index.json")"
          production_release_arm64="$(jq -r '
            .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "arm64")
              | .digest
            ' "$record_dir/registry-release-index.json")"
          test "$production_scientific_amd64" = "$candidate_scientific_amd64"
          test "$production_scientific_arm64" = "$candidate_scientific_arm64"
          test "$production_release_arm64" = "$candidate_release_arm64"
          jq -S -c -n \
            --arg candidate_branch "$(jq -r .candidate_branch \
              "$candidate_dir/candidate-closure.json")" \
            --argjson candidate_run_id "$(jq -r .github_run_id \
              "$candidate_dir/candidate-closure.json")" \
            --arg release_linux_arm64_manifest_digest \
              "$production_release_arm64" \
            --arg scientific_linux_amd64_manifest_digest \
              "$production_scientific_amd64" \
            --arg scientific_linux_arm64_manifest_digest \
              "$production_scientific_arm64" '
              {candidate_branch: $candidate_branch,
               candidate_run_id: $candidate_run_id,
               executable_platform_manifests_equal: true,
               release_linux_arm64_manifest_digest:
                 $release_linux_arm64_manifest_digest,
               schema_version: "fractal-c0-candidate-production-byte-identity-v1",
               scientific_linux_amd64_manifest_digest:
                 $scientific_linux_amd64_manifest_digest,
               scientific_linux_arm64_manifest_digest:
                 $scientific_linux_arm64_manifest_digest}' \
            > "$record_dir/candidate-production-byte-identity.json"
          scientific_candidate_raw_sha256="$(sha256sum \
            "$promotion_dir/candidate-scientific-index.raw.json" | cut -d ' ' -f 1)"
          scientific_production_raw_sha256="$(sha256sum \
            "$promotion_dir/promoted-scientific-index.raw.json" | cut -d ' ' -f 1)"
          scientific_anonymous_raw_sha256="$(sha256sum \
            "$anonymous_dir/anonymous-registry-index.raw.json" | cut -d ' ' -f 1)"
          release_candidate_raw_sha256="$(sha256sum \
            "$promotion_dir/candidate-release-index.raw.json" | cut -d ' ' -f 1)"
          release_production_raw_sha256="$(sha256sum \
            "$promotion_dir/promoted-release-index.raw.json" | cut -d ' ' -f 1)"
          release_anonymous_raw_sha256="$(sha256sum \
            "$anonymous_dir/anonymous-release-registry-index.raw.json" | cut -d ' ' -f 1)"
          jq -S -c -n \
            --arg bootstrap_candidate_source_commit "$(jq -r .github_sha \
              "$candidate_dir/candidate-closure.json")" \
            --argjson bootstrap_candidate_run_id "$(jq -r .github_run_id \
              "$candidate_dir/candidate-closure.json")" \
            --arg build_context_tree_sha256 "$BUILD_CONTEXT_TREE_SHA256" \
            --arg completed_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg current_c0_commit "$C0_SHA" \
            --arg release_anonymous_raw_index_sha256 "$release_anonymous_raw_sha256" \
            --arg release_anonymous_observed_digest "$(jq -r .observed_digest \
              "$anonymous_dir/anonymous-release-registry-verification.json")" \
            --arg release_candidate_raw_index_sha256 "$release_candidate_raw_sha256" \
            --arg release_candidate_reference "$(jq -r .release_image_reference \
              "$candidate_dir/candidate-closure.json")" \
            --arg release_index_digest "$RELEASE_IMAGE_DIGEST" \
            --arg release_linux_arm64_manifest_digest "$production_release_arm64" \
            --arg release_production_raw_index_sha256 "$release_production_raw_sha256" \
            --arg release_production_reference \
              "${RELEASE_IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}" \
            --arg scientific_anonymous_raw_index_sha256 \
              "$scientific_anonymous_raw_sha256" \
            --arg scientific_anonymous_observed_digest "$(jq -r .observed_digest \
              "$anonymous_dir/anonymous-registry-verification.json")" \
            --arg scientific_candidate_raw_index_sha256 \
              "$scientific_candidate_raw_sha256" \
            --arg scientific_candidate_reference "$(jq -r .scientific_image_reference \
              "$candidate_dir/candidate-closure.json")" \
            --arg scientific_index_digest "$IMAGE_DIGEST" \
            --arg scientific_linux_amd64_manifest_digest \
              "$production_scientific_amd64" \
            --arg scientific_linux_arm64_manifest_digest \
              "$production_scientific_arm64" \
            --arg scientific_production_raw_index_sha256 \
              "$scientific_production_raw_sha256" \
            --arg scientific_production_reference "${IMAGE_NAME}@${IMAGE_DIGEST}" '
              {bootstrap_candidate_run_id: $bootstrap_candidate_run_id,
               bootstrap_candidate_source_commit: $bootstrap_candidate_source_commit,
               build_context_tree_sha256: $build_context_tree_sha256,
               completed_at_utc: $completed_at_utc,
               current_c0_commit: $current_c0_commit,
               method: "docker-buildx-imagetools-create-v0.34.1",
               release_anonymous_observed_digest:
                 $release_anonymous_observed_digest,
               release_anonymous_raw_index_sha256:
                 $release_anonymous_raw_index_sha256,
               release_anonymous_readback_equal: true,
               release_candidate_raw_index_sha256:
                 $release_candidate_raw_index_sha256,
               release_candidate_reference: $release_candidate_reference,
               release_index_digest: $release_index_digest,
               release_linux_arm64_manifest_digest:
                 $release_linux_arm64_manifest_digest,
               release_production_raw_index_sha256:
                 $release_production_raw_index_sha256,
               release_production_reference: $release_production_reference,
               release_raw_index_equal: true,
               schema_version: "fractal-c0-oci-promotion-v1",
               scientific_anonymous_observed_digest:
                 $scientific_anonymous_observed_digest,
               scientific_anonymous_raw_index_sha256:
                 $scientific_anonymous_raw_index_sha256,
               scientific_anonymous_readback_equal: true,
               scientific_candidate_raw_index_sha256:
                 $scientific_candidate_raw_index_sha256,
               scientific_candidate_reference: $scientific_candidate_reference,
               scientific_index_digest: $scientific_index_digest,
               scientific_linux_amd64_manifest_digest:
                 $scientific_linux_amd64_manifest_digest,
               scientific_linux_arm64_manifest_digest:
                 $scientific_linux_arm64_manifest_digest,
               scientific_production_raw_index_sha256:
                 $scientific_production_raw_index_sha256,
               scientific_production_reference: $scientific_production_reference,
               scientific_raw_index_equal: true}' \
            > "$record_dir/oci-promotion-receipt.json"
          install -d -m 0700 "$record_dir/candidate-rehearsal-readback"
          cp -- "$candidate_dir"/* "$record_dir/candidate-rehearsal-readback/"
          install -d -m 0700 "$record_dir/candidate-oci-promotion"
          cp -- "$promotion_dir"/* "$record_dir/candidate-oci-promotion/"
          rehearsal_dir="${RUNNER_TEMP}/provider-rehearsal-gate"
          test -f "$rehearsal_dir/provider-rehearsal-production-gate.json"
          install -d -m 0700 "$record_dir/provider-rehearsal-readback"
          cp -- "$rehearsal_dir"/* "$record_dir/provider-rehearsal-readback/"

      - name: Set up Python for post-A control verification
        if: inputs.mode == 'production'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"

      - name: Set up uv for post-A control verification
        if: inputs.mode == 'production'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Install the fixed post-A control verifier
        if: inputs.mode == 'production'
        run: uv sync --frozen --no-install-project

      - name: Authenticate and retain the GitHub approval controls
        if: inputs.mode == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name)" = "$GITHUB_REPOSITORY"
          snapshots="${RUNNER_TEMP}/github-environment-control-api"
          record_root="${RUNNER_TEMP}/confirmatory-image-digest"
          receipt="${record_root}/github-environment-control-receipt.json"
          readback="${RUNNER_TEMP}/github-environment-control-receipt.readback.json"
          install -d -m 0700 "$snapshots"
          test -d "$record_root"
          test ! -e "$receipt"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            | jq -S -c . > "$snapshots/environments-list.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/environments/confirmatory" \
            | jq -S -c . > "$snapshots/environment-confirmatory.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/environments/confirmatory/deployment-branch-policies?per_page=100" \
            | jq -S -c . > "$snapshots/deployment-policies-confirmatory.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/environments/confirmatory-rehearsal" \
            | jq -S -c . > "$snapshots/environment-confirmatory-rehearsal.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/environments/confirmatory-rehearsal/deployment-branch-policies?per_page=100" \
            | jq -S -c . > "$snapshots/deployment-policies-confirmatory-rehearsal.json"
          uv run --frozen --no-sync \
            python -m fractal_ann_diagnostics.github_environment_control verify \
            --environments-list "$snapshots/environments-list.json" \
            --confirmatory-environment "$snapshots/environment-confirmatory.json" \
            --confirmatory-deployment-policies \
              "$snapshots/deployment-policies-confirmatory.json" \
            --rehearsal-environment \
              "$snapshots/environment-confirmatory-rehearsal.json" \
            --rehearsal-deployment-policies \
              "$snapshots/deployment-policies-confirmatory-rehearsal.json" \
            --receipt "$receipt"
          uv run --frozen --no-sync \
            python -m fractal_ann_diagnostics.github_environment_control readback \
            --receipt "$receipt" > "$readback"
          cmp --silent "$receipt" "$readback"
          jq -e '
            .schema_version == "fractal-github-environment-control-v1"
            and .repository == "mhdk1602/fractal-ann-diagnostics"
            and .reviewer_login == "mhdk1602"
            and .approval_classification == "sole-operator-recorded-self-approval"
            and .independent_custody == false
            and ([.environments[].name] | sort)
              == ["confirmatory", "confirmatory-rehearsal"]
          ' "$receipt" >/dev/null

      - name: Download the exact post-A control tree
        if: inputs.mode == 'production'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-control-instantiation-${{ inputs.c0_sha }}
          path: ${{ runner.temp }}/production-control-instantiation-readback

      - name: Authenticate and retain the exact post-A control tree
        if: inputs.mode == 'production'
        shell: bash
        env:
          C0_SHA: ${{ inputs.c0_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/production-control-instantiation-readback"
          record_root="${RUNNER_TEMP}/confirmatory-image-digest"
          target_root="${record_root}/production-control-instantiation"
          candidate="${RUNNER_TEMP}/candidate-rehearsal-readback/candidate-closure.json"
          rehearsal="${RUNNER_TEMP}/provider-rehearsal-gate/provider-rehearsal-receipt.json"
          test -d "$source_root"
          test -d "$record_root"
          test ! -e "$target_root"
          test -f "$candidate"
          test -f "$rehearsal"
          uv run --frozen --no-sync python - \
            "$source_root" "$target_root" "$candidate" "$rehearsal" \
            "$C0_SHA" "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            "$RELEASE_IMAGE_DIGEST" <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import sys

          from fractal_ann_diagnostics.artifact_integrity import digest_directory_tree
          from fractal_ann_diagnostics.production_controls import (
              C0_INSTANTIATION_RECEIPT_FILENAME,
              load_production_control_c0_instantiation_receipt,
          )
          from fractal_ann_diagnostics.provider_rehearsal import CandidateImageClosure
          from fractal_ann_diagnostics.study import FIXED_CORPORA

          source = pathlib.Path(sys.argv[1]).resolve()
          target = pathlib.Path(sys.argv[2]).resolve()
          candidate_path = pathlib.Path(sys.argv[3]).resolve()
          rehearsal_path = pathlib.Path(sys.argv[4]).resolve()
          apparatus_commit = sys.argv[5]
          scientific_production_reference = sys.argv[6]
          release_image_index_digest = sys.argv[7]

          receipt_path = source / C0_INSTANTIATION_RECEIPT_FILENAME
          receipt_bytes = receipt_path.read_bytes()
          receipt = load_production_control_c0_instantiation_receipt(receipt_path)
          candidate = CandidateImageClosure.from_file(candidate_path)
          rehearsal_bytes = rehearsal_path.read_bytes()
          rehearsal = json.loads(rehearsal_bytes)
          canonical_rehearsal = (
              json.dumps(
                  rehearsal,
                  allow_nan=False,
                  ensure_ascii=True,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("ascii")
              + b"\n"
          )
          if rehearsal_bytes != canonical_rehearsal:
              raise SystemExit("provider rehearsal receipt is not canonical")

          expected_membership = frozenset(
              (*receipt.instantiated_payload_entries, C0_INSTANTIATION_RECEIPT_FILENAME)
          )
          observed = digest_directory_tree(source)
          if frozenset(observed.entries) != expected_membership:
              raise SystemExit("downloaded control tree has another membership")
          payload = digest_directory_tree(
              source,
              included_entries=receipt.instantiated_payload_entries,
          )
          exact = {
              "apparatus_commit": apparatus_commit,
              "approval_environment": "confirmatory",
              "candidate_image_source_commit": candidate.github_sha,
              "build_context_tree_sha256": candidate.build_context_tree_sha256,
              "candidate_image_closure_file_sha256": candidate.file_sha256,
              "candidate_bootstrap_closure_sha256": candidate.bootstrap_closure_sha256,
              "candidate_manifest_sha256": rehearsal["manifest_sha256"],
              "scientific_candidate_reference": candidate.scientific_image_reference,
              "scientific_production_reference": scientific_production_reference,
              "scientific_index_digest": candidate.scientific_image_index_digest,
              "release_image_index_digest": release_image_index_digest,
              "runner_platform": "linux/arm64",
              "instantiated_payload_tree_sha256": payload.sha256,
          }
          for field, expected in exact.items():
              if getattr(receipt, field) != expected:
                  raise SystemExit(f"downloaded control tree has invalid {field}")
          candidate_manifest = source / receipt.candidate_manifest_relative_path
          assembly_receipt = (
              source / receipt.candidate_manifest_assembly_receipt_relative_path
          )
          if hashlib.sha256(candidate_manifest.read_bytes()).hexdigest() != (
              receipt.candidate_manifest_file_sha256
          ):
              raise SystemExit("downloaded candidate manifest snapshot differs")
          if hashlib.sha256(assembly_receipt.read_bytes()).hexdigest() != (
              receipt.candidate_manifest_assembly_receipt_file_sha256
          ):
              raise SystemExit("downloaded candidate assembly receipt snapshot differs")
          if receipt.file_sha256 != hashlib.sha256(receipt_bytes).hexdigest():
              raise SystemExit("control instantiation receipt file digest differs")
          if tuple(row.corpus_id for row in receipt.workloads) != FIXED_CORPORA:
              raise SystemExit("control instantiation lacks the five fixed corpora")

          shutil.copytree(source, target, copy_function=shutil.copyfile)
          retained = load_production_control_c0_instantiation_receipt(
              target / C0_INSTANTIATION_RECEIPT_FILENAME,
              expected_sha256=receipt.file_sha256,
          )
          retained_tree = digest_directory_tree(target)
          retained_payload = digest_directory_tree(
              target,
              included_entries=retained.instantiated_payload_entries,
          )
          retained_manifest = target / retained.candidate_manifest_relative_path
          retained_assembly = (
              target / retained.candidate_manifest_assembly_receipt_relative_path
          )
          if (
              retained != receipt
              or frozenset(retained_tree.entries) != expected_membership
              or retained_payload.sha256 != receipt.instantiated_payload_tree_sha256
              or hashlib.sha256(retained_manifest.read_bytes()).hexdigest()
              != receipt.candidate_manifest_file_sha256
              or hashlib.sha256(retained_assembly.read_bytes()).hexdigest()
              != receipt.candidate_manifest_assembly_receipt_file_sha256
          ):
              raise SystemExit("retained control instantiation differs after copy")
          PY

      - name: Close the retained C0 artifact checksum set
        shell: bash
        run: |
          set -euo pipefail
          record_dir="${RUNNER_TEMP}/confirmatory-image-digest"
          artifact_checksums_temp="${RUNNER_TEMP}/C0-ARTIFACT-SHA256SUMS.tmp"
          test ! -e "$artifact_checksums_temp"
          (
            cd "$record_dir"
            find . -type f ! -name C0-ARTIFACT-SHA256SUMS -printf '%P\0' \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > "$artifact_checksums_temp"
            test -s "$artifact_checksums_temp"
            sha256sum -c "$artifact_checksums_temp"
          )
          install -m 0444 "$artifact_checksums_temp" \
            "$record_dir/C0-ARTIFACT-SHA256SUMS"

      - name: Attest every retained C0 artifact
        id: artifact_attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ runner.temp }}/confirmatory-image-digest/C0-ARTIFACT-SHA256SUMS
          create-storage-record: false

      - name: Verify every retained C0 artifact attestation
        shell: bash
        env:
          ARTIFACT_ATTESTATION_BUNDLE: ${{ steps.artifact_attestation.outputs.bundle-path }}
          C0_SHA: ${{ inputs.c0_sha }}
        run: |
          set -euo pipefail
          record_dir="${RUNNER_TEMP}/confirmatory-image-digest"
          checksums="$record_dir/C0-ARTIFACT-SHA256SUMS"
          test -f "$ARTIFACT_ATTESTATION_BUNDLE"
          verification="$record_dir/c0-artifact-attestation-verification.jsonl"
          : > "$verification"
          verified_count=0
          while read -r expected_sha256 relative_path; do
            if [[ ! "$expected_sha256" =~ ^[0-9a-f]{64}$ ]] \
                || [[ ! "$relative_path" =~ ^[A-Za-z0-9._/-]+$ ]] \
                || [[ "$relative_path" == /* ]] \
                || [[ "$relative_path" == -* ]] \
                || [[ "/${relative_path}/" == *"/../"* ]]; then
              echo 'Retained artifact checksum row is not canonical' >&2
              exit 70
            fi
            subject="$record_dir/$relative_path"
            test -f "$subject"
            test "$(sha256sum "$subject" | cut -d ' ' -f 1)" = "$expected_sha256"
            (
              cd "$record_dir"
              gh attestation verify "$relative_path" \
                --hostname github.com \
                --repo "$GITHUB_REPOSITORY" \
                --bundle "$ARTIFACT_ATTESTATION_BUNDLE" \
                --cert-identity \
                  "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/confirmatory-image.yml@${C0_REF}" \
                --source-digest "$C0_SHA" \
                --source-ref "$C0_REF" \
                --deny-self-hosted-runners \
                --format json
            ) \
              | jq -S -c . >> "$verification"
            verified_count=$((verified_count + 1))
          done < "$checksums"
          test "$verified_count" -gt 0
          test "$(wc -l < "$verification")" -eq "$verified_count"

      - name: Seal the retained artifact package
        shell: bash
        env:
          ARTIFACT_ATTESTATION_BUNDLE: ${{ steps.artifact_attestation.outputs.bundle-path }}
          ARTIFACT_ATTESTATION_ID: ${{ steps.artifact_attestation.outputs.attestation-id }}
          ARTIFACT_ATTESTATION_URL: ${{ steps.artifact_attestation.outputs.attestation-url }}
        run: |
          set -euo pipefail
          record_dir="${RUNNER_TEMP}/confirmatory-image-digest"
          test -f "$ARTIFACT_ATTESTATION_BUNDLE"
          test -n "$ARTIFACT_ATTESTATION_ID"
          test -n "$ARTIFACT_ATTESTATION_URL"
          cp -- "$ARTIFACT_ATTESTATION_BUNDLE" \
            "$record_dir/c0-artifact-attestation-bundle.json"
          printf '%s\n' "$ARTIFACT_ATTESTATION_ID" \
            > "$record_dir/c0-artifact-attestation-id.txt"
          printf '%s\n' "$ARTIFACT_ATTESTATION_URL" \
            > "$record_dir/c0-artifact-attestation-url.txt"
          sha256sum "$record_dir/c0-artifact-attestation-bundle.json" \
            > "$record_dir/c0-artifact-attestation-bundle.sha256"
          package_checksums_temp="${RUNNER_TEMP}/PACKAGE-SHA256SUMS.tmp"
          test ! -e "$package_checksums_temp"
          (
            cd "$record_dir"
            find . -type f ! -name PACKAGE-SHA256SUMS -printf '%P\0' \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > "$package_checksums_temp"
            test -s "$package_checksums_temp"
            sha256sum -c "$package_checksums_temp"
          )
          install -m 0444 "$package_checksums_temp" \
            "$record_dir/PACKAGE-SHA256SUMS"

      - name: Materialize the candidate rehearsal closure
        if: inputs.mode == 'candidate'
        shell: bash
        env:
          BUILD_CONTEXT_TREE_SHA256: ${{ steps.source.outputs.context_tree_sha256 }}
          C0_SHA: ${{ inputs.c0_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
        run: |
          set -euo pipefail
          record_dir="${RUNNER_TEMP}/confirmatory-image-digest"
          closure_dir="${RUNNER_TEMP}/candidate-rehearsal-closure"
          install -d -m 0700 "$closure_dir"
          package_checksums_sha256="$(sha256sum \
            "$record_dir/PACKAGE-SHA256SUMS" | cut -d ' ' -f 1)"
          candidate_branch="${GITHUB_REF#refs/heads/}"
          scientific_linux_amd64_manifest_digest="$(jq -r '
            .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "amd64")
              | .digest
            ' "$record_dir/registry-index.json")"
          scientific_linux_arm64_manifest_digest="$(jq -r '
            .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "arm64")
              | .digest
            ' "$record_dir/registry-index.json")"
          release_linux_arm64_manifest_digest="$(jq -r '
            .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "arm64")
              | .digest
            ' "$record_dir/registry-release-index.json")"
          scientific_linux_amd64_runtime_extraction_sha256="$(sha256sum \
            "$record_dir/runtime-artifacts/linux-amd64/runtime-extraction.json" \
            | cut -d ' ' -f 1)"
          scientific_linux_arm64_runtime_extraction_sha256="$(sha256sum \
            "$record_dir/runtime-artifacts/linux-arm64/runtime-extraction.json" \
            | cut -d ' ' -f 1)"
          scientific_oci_attestation_bundle_sha256="$(sha256sum \
            "$record_dir/github-attestation-bundle.json" | cut -d ' ' -f 1)"
          scientific_oci_attestation_verification_sha256="$(sha256sum \
            "$record_dir/github-attestation-verification.json" | cut -d ' ' -f 1)"
          release_oci_attestation_bundle_sha256="$(sha256sum \
            "$record_dir/github-release-attestation-bundle.json" | cut -d ' ' -f 1)"
          release_oci_attestation_verification_sha256="$(sha256sum \
            "$record_dir/github-release-attestation-verification.json" | cut -d ' ' -f 1)"
          release_reproducibility_receipt_sha256="$(sha256sum \
            "$record_dir/release-arm64-oci-reproducibility.json" | cut -d ' ' -f 1)"
          release_security_adjudication_sha256="$(sha256sum \
            "$record_dir/release-linux-arm64-security-adjudication.json" | cut -d ' ' -f 1)"
          release_govulncheck_adjudication_sha256="$(sha256sum \
            "$record_dir/tlock-govulncheck/reachability-adjudication.json" \
            | cut -d ' ' -f 1)"
          release_tle_interoperability_receipt_sha256="$(sha256sum \
            "$record_dir/tlock-quicknet-interoperability/interoperability-receipt.json" \
            | cut -d ' ' -f 1)"
          jq -S -c -n \
            --arg candidate_branch "$candidate_branch" \
            --arg candidate_package_checksums_sha256 \
              "$package_checksums_sha256" \
            --arg github_ref "$GITHUB_REF" \
            --arg github_sha "$GITHUB_SHA" \
            --arg github_workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg github_workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg scientific_image_index_digest "$IMAGE_DIGEST" \
            --arg scientific_image_reference "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --arg scientific_linux_amd64_manifest_digest \
              "$scientific_linux_amd64_manifest_digest" \
            --arg scientific_linux_arm64_manifest_digest \
              "$scientific_linux_arm64_manifest_digest" \
            --arg scientific_linux_amd64_runtime_extraction_sha256 \
              "$scientific_linux_amd64_runtime_extraction_sha256" \
            --arg scientific_linux_arm64_runtime_extraction_sha256 \
              "$scientific_linux_arm64_runtime_extraction_sha256" \
            --arg scientific_oci_attestation_bundle_sha256 \
              "$scientific_oci_attestation_bundle_sha256" \
            --arg scientific_oci_attestation_verification_sha256 \
              "$scientific_oci_attestation_verification_sha256" \
            --arg release_image_index_digest "$RELEASE_IMAGE_DIGEST" \
            --arg release_image_reference \
              "${RELEASE_IMAGE_NAME}@${RELEASE_IMAGE_DIGEST}" \
            --arg release_linux_arm64_manifest_digest \
              "$release_linux_arm64_manifest_digest" \
            --arg release_govulncheck_adjudication_sha256 \
              "$release_govulncheck_adjudication_sha256" \
            --arg release_oci_attestation_bundle_sha256 \
              "$release_oci_attestation_bundle_sha256" \
            --arg release_oci_attestation_verification_sha256 \
              "$release_oci_attestation_verification_sha256" \
            --arg release_reproducibility_receipt_sha256 \
              "$release_reproducibility_receipt_sha256" \
            --arg release_security_adjudication_sha256 \
              "$release_security_adjudication_sha256" \
            --arg release_tle_interoperability_receipt_sha256 \
              "$release_tle_interoperability_receipt_sha256" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson github_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson github_run_id "$GITHUB_RUN_ID" \
            '{build_context_tree_sha256: $build_context_tree_sha256,
              candidate_branch: $candidate_branch,
              candidate_package_checksums_sha256:
                $candidate_package_checksums_sha256,
              github_ref: $github_ref,
              github_run_attempt: $github_run_attempt,
              github_run_id: $github_run_id,
              github_sha: $github_sha,
              github_workflow_ref: $github_workflow_ref,
              github_workflow_sha: $github_workflow_sha,
              mode: "candidate",
              release_govulncheck_adjudication_sha256:
                $release_govulncheck_adjudication_sha256,
              release_image_index_digest: $release_image_index_digest,
              release_image_reference: $release_image_reference,
              release_linux_arm64_manifest_digest:
                $release_linux_arm64_manifest_digest,
              release_oci_attestation_bundle_sha256:
                $release_oci_attestation_bundle_sha256,
              release_oci_attestation_verification_sha256:
                $release_oci_attestation_verification_sha256,
              release_reproducibility_receipt_sha256:
                $release_reproducibility_receipt_sha256,
              release_security_adjudication_sha256:
                $release_security_adjudication_sha256,
              release_tle_interoperability_receipt_sha256:
                $release_tle_interoperability_receipt_sha256,
              repository: $repository,
              schema_version: "fractal-c0-candidate-closure-v2",
              scientific_image_index_digest: $scientific_image_index_digest,
              scientific_image_reference: $scientific_image_reference,
              scientific_linux_amd64_manifest_digest:
                $scientific_linux_amd64_manifest_digest,
              scientific_linux_amd64_runtime_extraction_sha256:
                $scientific_linux_amd64_runtime_extraction_sha256,
              scientific_linux_arm64_manifest_digest:
                $scientific_linux_arm64_manifest_digest,
              scientific_linux_arm64_runtime_extraction_sha256:
                $scientific_linux_arm64_runtime_extraction_sha256,
              scientific_oci_attestation_bundle_sha256:
                $scientific_oci_attestation_bundle_sha256,
              scientific_oci_attestation_verification_sha256:
                $scientific_oci_attestation_verification_sha256}' \
            > "$closure_dir/candidate-closure.json"
          (
            cd "$closure_dir"
            sha256sum candidate-closure.json > candidate-closure.sha256
            sha256sum -c candidate-closure.sha256
            chmod 0444 candidate-closure.json candidate-closure.sha256
          )

      - name: Upload the candidate rehearsal closure
        if: inputs.mode == 'candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confirmatory-image-candidate-closure-${{ inputs.c0_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-rehearsal-closure
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 90

      - name: Upload the immutable digest record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confirmatory-image-${{ inputs.mode }}-${{ inputs.c0_sha }}
          path: ${{ runner.temp }}/confirmatory-image-digest
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 90
