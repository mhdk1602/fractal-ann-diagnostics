            test -f "$runtime_dir/opa-build/opa-build-receipt.json"
            test -f "$runtime_dir/opa-build/opa-go-build-info.txt"
            test -f "$runtime_dir/libsqlite3.so.0"
            test -f "$runtime_dir/libz.so.1"
            cmp --silent uv.lock "$runtime_dir/uv.lock"
            test "$(find "$runtime_dir/hnswlib" -maxdepth 1 -type f \
              -name 'hnswlib-0.8.0-*.whl' | wc -l)" -eq 1
            wheel="$(find "$runtime_dir/hnswlib" -maxdepth 1 -type f \
              -name 'hnswlib-0.8.0-*.whl')"
            wheel_basename="$(basename "$wheel")"
            wheel_sha256="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
            wheel_byte_count="$(stat -c '%s' "$wheel")"
            python - \
