            native_build_receipt_sha256="$(sha256sum \
              "$runtime_dir/native-build/native-build-receipt.json" | cut -d ' ' -f 1)"
            opa_build_receipt_sha256="$(sha256sum \
              "$runtime_dir/opa-build/opa-build-receipt.json" | cut -d ' ' -f 1)"
            runtime_library_manifest_sha256="$(sha256sum \
              "$runtime_dir/runtime-library-manifest.json" | cut -d ' ' -f 1)"
            sqlite_library_sha256="$(sha256sum "$runtime_dir/libsqlite3.so.0" \
