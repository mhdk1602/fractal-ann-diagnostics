[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fractal-ann-diagnostics"
version = "0.3.0"
description = "Protocol apparatus for authorization-first, geometry-aware retrieval governance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "mhdk1602", email = "mhdk1602@users.noreply.github.com" },
]
keywords = [
    "approximate-nearest-neighbor",
    "HNSW",
    "intrinsic-dimensionality",
    "local-intrinsic-dimensionality",
    "fractal-dimension",
    "correlation-dimension",
    "vector-search",
    "ANN-benchmarks",
    "retrieval-augmented-generation",
    "authorization",
    "filtered-vector-search",
    "AI-governance",
    "artifact-integrity",
    "cluster-bootstrap",
    "confirmatory-research",
    "policy-as-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "py-ecc==8.0.0",
    "truststore==0.10.4",
]

[project.optional-dependencies]
hnsw = ["hnswlib>=0.8.0"]
faiss = ["faiss-cpu>=1.7"]
benchmarks = ["h5py>=3.10", "pyarrow>=14.0"]
production-embedding = ["torch==2.13.0", "transformers==5.13.1"]
dev = ["hatchling>=1.27", "pytest>=7.0", "ruff>=0.3", "pre-commit>=3.0"]

[project.scripts]
fractal-retrieval-governance = "fractal_ann_diagnostics.cli:main"
fractal-artifact-pipeline = "fractal_ann_diagnostics.artifact_pipeline:main"
fractal-c1-manifest-transition = "fractal_ann_diagnostics.c1_manifest_transition:main"
fractal-development-cohort = "fractal_ann_diagnostics.development_cohort:main"
fractal-development-execution = "fractal_ann_diagnostics.development_execution:main"
fractal-github-environment-control = "fractal_ann_diagnostics.github_environment_control:main"
fractal-confirmatory-input = "fractal_ann_diagnostics.confirmatory_input_operator:main"
fractal-candidate-manifest-assembler = "fractal_ann_diagnostics.candidate_manifest_assembler:main"
fractal-opa-runtime-binary = "fractal_ann_diagnostics.opa_runtime_binary:main"
fractal-post-embedding-development = "fractal_ann_diagnostics.post_embedding_development:main"
fractal-production-artifacts = "fractal_ann_diagnostics.production_artifact_factory:main"
fractal-production-controls = "fractal_ann_diagnostics.production_controls:main"
fractal-production-embeddings = "fractal_ann_diagnostics.production_embedding_build:main"
fractal-provider-plans = "fractal_ann_diagnostics.provider_plan_operator:main"
fractal-provider-runner-activation = "fractal_ann_diagnostics.provider_runner_activation:main"
fractal-sealed-container-launcher = "fractal_ann_diagnostics.sealed_container_launcher:main"
fractal-zenodo-publication = "fractal_ann_diagnostics.zenodo_publication:main"

[project.urls]
Repository = "https://github.com/mhdk1602/fractal-ann-diagnostics"
"Confirmatory protocol" = "https://github.com/mhdk1602/fractal-ann-diagnostics/blob/master/research/preregistration.md"
"Evidence ledger" = "https://github.com/mhdk1602/fractal-ann-diagnostics/blob/master/research/literature.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_ann_diagnostics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
