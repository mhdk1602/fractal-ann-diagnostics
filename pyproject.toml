[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fractal-ann-diagnostics"
version = "0.3.0"
description = "Protocol apparatus for authorization-first, geometry-aware retrieval governance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "mhdk1602", email = "mhdk1602@users.noreply.github.com" },
]
keywords = [
    "approximate-nearest-neighbor",
    "HNSW",
    "intrinsic-dimensionality",
    "local-intrinsic-dimensionality",
    "fractal-dimension",
    "correlation-dimension",
    "vector-search",
    "ANN-benchmarks",
    "retrieval-augmented-generation",
    "authorization",
    "filtered-vector-search",
    "AI-governance",
    "artifact-integrity",
    "cluster-bootstrap",
    "confirmatory-research",
    "policy-as-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
hnsw = ["hnswlib>=0.8.0"]
faiss = ["faiss-cpu>=1.7"]
benchmarks = ["h5py>=3.10", "pyarrow>=14.0"]
dev = ["hatchling>=1.27", "pytest>=7.0", "ruff>=0.3", "pre-commit>=3.0"]

[project.scripts]
fractal-retrieval-governance = "fractal_ann_diagnostics.cli:main"

[project.urls]
Repository = "https://github.com/mhdk1602/fractal-ann-diagnostics"
"Confirmatory protocol" = "https://github.com/mhdk1602/fractal-ann-diagnostics/blob/master/research/preregistration.md"
"Evidence ledger" = "https://github.com/mhdk1602/fractal-ann-diagnostics/blob/master/research/literature.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_ann_diagnostics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
