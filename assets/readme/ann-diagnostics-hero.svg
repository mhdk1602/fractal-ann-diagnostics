<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Fractal ANN Diagnostics</title>
  <desc id="desc">Dark technical banner: HNSW layer stack on the right with nodes coloured by local intrinsic dimensionality, descriptor cards on the left.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="0.5" stop-color="#0d1d2b"/>
      <stop offset="1" stop-color="#102230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="0.5" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#9b6cff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11202f" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a1320" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="lidLow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="lidHigh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b84b"/>
      <stop offset="1" stop-color="#f25f5c"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" stroke="#1d3550" stroke-width="0.6" fill="none" opacity="0.55"/>
    </pattern>
    <style>
      .eyebrow { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8aa3bb; letter-spacing: 0.22em; }
      .title { font: 800 56px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; fill: #f4f9ff; letter-spacing: -0.01em; }
      .subtitle { font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c7d3e1; }
      .tagline { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #93a7bc; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8ff2df; letter-spacing: 0.08em; }
      .micro { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #9aafc4; letter-spacing: 0.18em; }
      .metric { font: 800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .unit { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8ff2df; letter-spacing: 0.04em; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dce8f4; }
      .layer { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #93a7bc; letter-spacing: 0.18em; }
      .line { stroke: #2c4760; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="540" fill="url(#bg)"/>
  <rect width="1280" height="540" fill="url(#grid)" opacity="0.65"/>

  <g transform="translate(72 70)">
    <text class="eyebrow" textLength="490" lengthAdjust="spacingAndGlyphs">ANN INDEX DIAGNOSTICS &#8226; INTRINSIC DIMENSION</text>
    <text class="title" y="74">Don't tune the index.</text>
    <text class="title" y="138">Diagnose the data.</text>
    <text class="subtitle" y="182" textLength="640" lengthAdjust="spacingAndGlyphs">Fractal descriptors that predict ANN failure modes</text>
    <text class="subtitle" y="208" textLength="640" lengthAdjust="spacingAndGlyphs">before you spend a week chasing recall.</text>

    <g transform="translate(0 250)">
      <g>
        <rect width="328" height="60" rx="14" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
        <text class="mono" x="20" y="26">D2</text>
        <text class="label" x="56" y="26">Correlation dimension</text>
        <text class="unit" x="56" y="46">predicts HNSW recall vs ambient d</text>
      </g>
      <g transform="translate(0 70)">
        <rect width="328" height="60" rx="14" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
        <text class="mono" x="20" y="26">LID</text>
        <text class="label" x="56" y="26">Local intrinsic dimensionality</text>
        <text class="unit" x="56" y="46">per-point hardness, MLE estimator</text>
      </g>
      <g transform="translate(0 140)">
        <rect width="328" height="60" rx="14" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
        <text class="mono" x="20" y="26">MF&#916;</text>
        <text class="label" x="56" y="26">Multifractal spectrum width</text>
        <text class="unit" x="56" y="46">single vs mixture global scaling</text>
      </g>
      <g transform="translate(0 210)">
        <rect width="328" height="60" rx="14" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
        <text class="mono" x="20" y="26">HUB</text>
        <text class="label" x="56" y="26">Hubness ratio</text>
        <text class="unit" x="56" y="46">flat-NSW backbone signal</text>
      </g>
    </g>
  </g>

  <g transform="translate(746 60)">
    <rect width="468" height="420" rx="24" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
    <text class="micro" x="28" y="38">HNSW LAYERS &#8212; NODES COLOURED BY LID</text>

    <g transform="translate(48 76)">
      <text class="layer" x="0" y="2">LAYER 2</text>
      <line x1="80" y1="-4" x2="380" y2="-4" stroke="#2c4760" stroke-width="1"/>
      <g transform="translate(98 -8)">
        <circle cx="0" cy="0" r="9" fill="url(#lidLow)" filter="url(#softGlow)"/>
        <circle cx="92" cy="0" r="9" fill="url(#lidLow)" filter="url(#softGlow)"/>
        <circle cx="194" cy="0" r="9" fill="url(#lidHigh)" filter="url(#softGlow)"/>
        <circle cx="270" cy="0" r="9" fill="url(#lidLow)" filter="url(#softGlow)"/>
      </g>
    </g>

    <g transform="translate(48 156)">
      <text class="layer" x="0" y="2">LAYER 1</text>
      <line x1="80" y1="-4" x2="380" y2="-4" stroke="#2c4760" stroke-width="1"/>
      <g transform="translate(96 -8)">
        <circle cx="0" cy="0" r="8" fill="url(#lidLow)"/>
        <circle cx="50" cy="0" r="8" fill="url(#lidHigh)"/>
        <circle cx="96" cy="0" r="8" fill="url(#lidLow)"/>
        <circle cx="142" cy="0" r="8" fill="url(#lidLow)"/>
        <circle cx="188" cy="0" r="8" fill="url(#lidHigh)"/>
        <circle cx="234" cy="0" r="8" fill="url(#lidLow)"/>
        <circle cx="284" cy="0" r="8" fill="url(#lidLow)"/>
      </g>
    </g>

    <g transform="translate(48 236)">
      <text class="layer" x="0" y="2">LAYER 0</text>
      <line x1="80" y1="-4" x2="380" y2="-4" stroke="#2c4760" stroke-width="1"/>
      <g transform="translate(86 -8)">
        <circle cx="0" cy="0" r="7" fill="url(#lidLow)"/>
        <circle cx="30" cy="0" r="7" fill="url(#lidLow)"/>
        <circle cx="58" cy="0" r="7" fill="url(#lidHigh)"/>
        <circle cx="88" cy="0" r="7" fill="url(#lidLow)"/>
        <circle cx="118" cy="0" r="7" fill="url(#lidHigh)"/>
        <circle cx="148" cy="0" r="7" fill="url(#lidLow)"/>
        <circle cx="178" cy="0" r="7" fill="url(#lidHigh)"/>
        <circle cx="208" cy="0" r="7" fill="url(#lidHigh)"/>
        <circle cx="238" cy="0" r="7" fill="url(#lidLow)"/>
        <circle cx="268" cy="0" r="7" fill="url(#lidLow)"/>
        <circle cx="298" cy="0" r="7" fill="url(#lidHigh)"/>
      </g>
    </g>

    <g transform="translate(28 290)">
      <rect width="14" height="14" rx="3" fill="url(#lidLow)"/>
      <text class="label" x="22" y="12">low LID &#8226; easy</text>
      <rect x="186" width="14" height="14" rx="3" fill="url(#lidHigh)"/>
      <text class="label" x="208" y="12">high LID &#8226; search dead-end</text>
    </g>

    <g transform="translate(28 332)">
      <text class="micro" x="0" y="0">DIAGNOSTIC OUTPUT</text>
      <text class="mono" x="0" y="22">diagnose(vectors).recommended_index</text>
      <text class="label" x="0" y="44">&#8594; flat-nsw  &#8226;  recall_drop &#8776; 0.08</text>
      <text class="unit" x="0" y="62">workload = "recall@10", panel = D2 + LID + MF&#916; + HUB</text>
    </g>
  </g>

  <g transform="translate(72 510)">
    <text class="mono" x="0" y="0">&#10095; HNSW / IVF / FLAT-NSW / DISKANN  &#8226;  ANN-BENCHMARKS HARNESS  &#8226;  H3 PIVOT</text>
  </g>
</svg>
