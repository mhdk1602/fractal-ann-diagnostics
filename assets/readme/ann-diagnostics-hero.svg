<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">FractalGuard RAG</title>
  <desc id="desc">Neon authorization-first vector retrieval: policy narrows a fractal vector field, then a geometry controller routes to evidence or abstention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050916"/><stop offset="0.48" stop-color="#081629"/><stop offset="1" stop-color="#100b26"/>
    </linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#6cf7e5" stop-opacity=".24"/><stop offset="1" stop-color="#6cf7e5" stop-opacity="0"/></radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64f5df"/><stop offset=".5" stop-color="#56b9ff"/><stop offset="1" stop-color="#b17bff"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffcb68"/><stop offset="1" stop-color="#ff6d8d"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#28405f" stroke-width=".6" opacity=".4"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="field"><rect x="720" y="42" width="510" height="476" rx="30"/></clipPath>
    <style>
      .eyebrow{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;fill:#7ee9dc}
      .hero{font:800 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.035em;fill:#f7fbff}
      .sub{font:500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b9c9dd}
      .body{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8fa7c1}
      .mono{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;fill:#a8bad0}
      .label{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf7ff}
      .micro{font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;fill:#89a4c0}
    </style>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/><rect width="1280" height="560" fill="url(#grid)"/>
  <circle cx="882" cy="274" r="310" fill="url(#aura)"/>

  <g transform="translate(62 70)">
    <text class="eyebrow" y="0">AUTHORIZATION-FIRST / GEOMETRY-AWARE</text>
    <text class="hero" y="82">Search only what</text><text class="hero" y="143">may be known.</text>
    <text class="sub" y="195">Fractal risk control for governed RAG</text>
    <text class="body" y="231">Live IAM defines the evidence universe.</text>
    <text class="body" y="256">Query geometry decides effort, fallback, or abstention.</text>

    <g transform="translate(0 302)" filter="url(#shadow)">
      <rect width="610" height="130" rx="22" fill="#091525" stroke="#294866"/>
      <g transform="translate(22 22)">
        <rect width="128" height="84" rx="15" fill="#0b2230" stroke="#50dfcf"/>
        <text class="mono" x="14" y="22">01 / POLICY</text><text class="label" x="14" y="46">authorize</text><text class="micro" x="14" y="66">LIVE + VERSIONED</text>
      </g>
      <path d="M160 64H190" stroke="#5bead7" stroke-width="2"/><path d="m186 59 8 5-8 5" fill="none" stroke="#5bead7" stroke-width="2"/>
      <g transform="translate(202 22)">
        <rect width="128" height="84" rx="15" fill="#0b1c34" stroke="#55baff"/>
        <text class="mono" x="14" y="22">02 / GEOMETRY</text><text class="label" x="14" y="46">measure</text><text class="micro" x="14" y="66">LID + MULTISCALE</text>
      </g>
      <path d="M340 64H370" stroke="#708cff" stroke-width="2"/><path d="m366 59 8 5-8 5" fill="none" stroke="#708cff" stroke-width="2"/>
      <g transform="translate(382 22)">
        <rect width="204" height="84" rx="15" fill="#17152f" stroke="#a178ff"/>
        <text class="mono" x="14" y="22">03 / CONTROL</text><text class="label" x="14" y="46">widen · exact · abstain</text><text class="micro" x="14" y="66">NEVER GRANTS ACCESS</text>
      </g>
    </g>
    <text class="mono" y="472">ZERO DENIED CONTEXT / EXACT AUTHORIZED TRUTH / COUNTERFACTUAL ACTIONS</text>
  </g>

  <g clip-path="url(#field)">
    <rect x="720" y="42" width="510" height="476" rx="30" fill="#071222" stroke="#294967" stroke-width="2"/>
    <path d="M740 182C820 68 956 68 1038 175S1190 283 1212 196" fill="none" stroke="#173f5c" stroke-width="1"/>
    <path d="M740 390C822 476 930 468 1002 371s157-91 210 5" fill="none" stroke="#39265f" stroke-width="1"/>
    <text class="mono" x="748" y="76">AUTHORIZED VECTOR FIBER</text>

    <!-- recursive geometry: one cluster, four child clusters, sixteen local neighborhoods -->
    <g opacity=".28" stroke="#5cebd8" fill="none">
      <circle cx="972" cy="278" r="176"/><circle cx="972" cy="278" r="112"/><circle cx="972" cy="278" r="56"/>
    </g>
    <g stroke="#3b6f8c" stroke-width="1" opacity=".65">
      <path d="M972 278 853 171M972 278 1091 171M972 278 853 385M972 278 1091 385"/>
      <path d="M853 171 812 137M853 171 898 135M853 171 806 208M853 171 900 211"/>
      <path d="M1091 171 1046 134M1091 171 1138 139M1091 171 1048 211M1091 171 1142 207"/>
      <path d="M853 385 809 348M853 385 898 347M853 385 810 426M853 385 899 425"/>
      <path d="M1091 385 1046 347M1091 385 1138 350M1091 385 1048 426M1091 385 1142 423"/>
    </g>
    <g fill="#62f2df" filter="url(#glow)">
      <circle cx="972" cy="278" r="8"/><circle cx="853" cy="171" r="6"/><circle cx="1091" cy="171" r="6"/><circle cx="853" cy="385" r="6"/><circle cx="1091" cy="385" r="6"/>
    </g>
    <g fill="#65bfff">
      <circle cx="812" cy="137" r="4"/><circle cx="898" cy="135" r="4"/><circle cx="806" cy="208" r="4"/><circle cx="900" cy="211" r="4"/>
      <circle cx="1046" cy="134" r="4"/><circle cx="1138" cy="139" r="4"/><circle cx="1048" cy="211" r="4"/><circle cx="1142" cy="207" r="4"/>
      <circle cx="809" cy="348" r="4"/><circle cx="898" cy="347" r="4"/><circle cx="810" cy="426" r="4"/><circle cx="899" cy="425" r="4"/>
      <circle cx="1046" cy="347" r="4"/><circle cx="1138" cy="350" r="4"/><circle cx="1048" cy="426" r="4"/><circle cx="1142" cy="423" r="4"/>
    </g>

    <!-- denied points remain visibly outside the searchable fiber -->
    <g fill="#ff718d" opacity=".42">
      <circle cx="760" cy="112" r="3"/><circle cx="1187" cy="105" r="3"/><circle cx="761" cy="469" r="3"/><circle cx="1192" cy="470" r="3"/>
      <circle cx="772" cy="286" r="3"/><circle cx="1175" cy="281" r="3"/>
    </g>
    <g transform="translate(774 260)"><path d="M0 0h44v36H0z" fill="#10182b" stroke="#ff718d"/><path d="M12 0v-8c0-14 20-14 20 0v8" fill="none" stroke="#ff718d" stroke-width="3"/><text class="micro" x="-8" y="55" fill="#ff8da3">DENIED / UNSEEN</text></g>

    <g transform="translate(927 240)" filter="url(#shadow)">
      <rect width="90" height="76" rx="17" fill="#0a1e31" stroke="url(#neon)" stroke-width="2"/>
      <text class="mono" x="19" y="24">QUERY</text><text class="label" x="17" y="49">LID 18.4</text><text class="micro" x="17" y="65">RISK .57</text>
    </g>
    <g transform="translate(934 456)"><rect width="76" height="30" rx="15" fill="#132a26" stroke="#62f2df"/><text class="micro" x="14" y="19" fill="#8ff8e7">EVIDENCE</text></g>
    <path d="M972 318V448" stroke="url(#neon)" stroke-width="2" stroke-dasharray="5 7"/><path d="m966 440 6 10 6-10" fill="none" stroke="#65e8da" stroke-width="2"/>
  </g>
</svg>
